name: CI/CD Frontend Deploy to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Compilar y Distribuir Ionic Standalone
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js v22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Compilar aplicación Ionic Angular Standalone
        run: npm run build

      - name: Autenticar en AWS con IAM
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sincronizar artefactos hacia Amazon S3
        run: |
          echo "Sincronizando directorio www/ con S3..."
          aws s3 sync www/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidar Caché en CloudFront
        run: |
          echo "Invalidando caché de CloudFront..."
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"