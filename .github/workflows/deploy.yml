name: CI/CD Frontend Deploy to AWS S3 & CloudFront

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Compilar y Distribuir Ionic Standalone
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js v20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación para Producción
        run: npm run build

      - name: Autenticar en AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sincronizar artefactos hacia Amazon S3
        run: aws s3 sync www/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidar Caché en CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"