<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="cancelar()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title style="font-weight: bold;">{{ cliente ? 'Editar Paciente' : 'Nuevo Paciente' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light">
  <form [formGroup]="clienteForm" (ngSubmit)="submitForm()" class="ion-padding-bottom">
    
    <ion-list-header style="margin-top: 10px;">
      <ion-label color="primary" style="font-weight: bold;">Información del Paciente</ion-label>
    </ion-list-header>

    <ion-list lines="inset" class="ion-margin-bottom" style="border-radius: 12px; margin: 10px;">
      <ion-item>
        <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
        <ion-input formControlName="nombre_completo" type="text" label="Nombre Completo *" labelPlacement="floating" placeholder="Ej. Juan Pérez"></ion-input>
      </ion-item>

      <ion-item>
        <ion-icon name="phone-portrait-outline" slot="start" color="medium"></ion-icon>
        <ion-input formControlName="celular" type="tel" label="Teléfono Celular / WhatsApp (Opcional)" labelPlacement="floating" placeholder="Ej. 4491234567"></ion-input>
      </ion-item>

      <ion-item>
        <ion-icon name="call-outline" slot="start" color="medium"></ion-icon>
        <ion-input formControlName="telefono" type="tel" label="Teléfono Fijo (Opcional)" labelPlacement="floating" placeholder="Ej. 4499876543"></ion-input>
      </ion-item>

      <ion-item>
        <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
        <ion-input formControlName="email" type="email" label="Correo Electrónico (Opcional)" labelPlacement="floating" placeholder="usuario@correo.com"></ion-input>
      </ion-item>

      <ion-item>
        <ion-icon name="card-outline" slot="start" color="medium"></ion-icon>
        <ion-input formControlName="rfc" type="text" label="RFC (Opcional)" labelPlacement="floating" placeholder="ABCD123456XYZ" class="ion-text-uppercase"></ion-input>
      </ion-item>
    </ion-list>

    <ion-list-header>
      <ion-label color="primary" style="font-weight: bold;">Domicilio y Ubicación</ion-label>
    </ion-list-header>

    <ion-list lines="inset" style="border-radius: 12px; margin: 10px;">
      <ion-item>
        <ion-icon name="location-outline" slot="start" color="medium"></ion-icon>
        <ion-input formControlName="domicilio" type="text" label="Calle y Número" labelPlacement="floating"></ion-input>
      </ion-item>

      <ion-grid class="ion-no-padding">
        <ion-row>
          <ion-col size="8">
            <ion-item lines="inset">
              <ion-input formControlName="colonia" type="text" label="Colonia" labelPlacement="floating"></ion-input>
            </ion-item>
          </ion-col>
          <ion-col size="4">
            <ion-item lines="inset">
              <ion-input formControlName="cp" type="number" label="C.P." labelPlacement="floating"></ion-input>
            </ion-item>
          </ion-col>
        </ion-row>

        <ion-row>
          <ion-col size="6">
            <ion-item lines="none">
              <ion-input formControlName="localidad" type="text" label="Localidad" labelPlacement="floating"></ion-input>
            </ion-item>
          </ion-col>
          <ion-col size="6">
            <ion-item lines="none">
              <ion-input formControlName="estado" type="text" label="Estado" labelPlacement="floating"></ion-input>
            </ion-item>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-list>

    <div class="ion-padding">
      <ion-button expand="block" type="submit" [disabled]="clienteForm.invalid" shape="round" color="success" style="font-weight: bold; height: 46px;">
        <ion-icon name="save" slot="start"></ion-icon>
        {{ cliente ? 'Guardar Cambios' : 'Registrar Paciente' }}
      </ion-button>

      @if (cliente) {
        <ion-button expand="block" type="button" (click)="eliminarCliente()" shape="round" color="danger" fill="outline" style="font-weight: bold; height: 44px; margin-top: 12px;">
          <ion-icon name="trash-outline" slot="start"></ion-icon>
          Eliminar Paciente
        </ion-button>
      }
      
      <p class="ion-text-center" style="font-size: 0.8em; color: gray; margin-top: 12px;">
        * Campos obligatorios
      </p>
    </div>
  </form>
</ion-content>
