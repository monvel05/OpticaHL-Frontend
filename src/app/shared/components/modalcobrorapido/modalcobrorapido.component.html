<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>⚡ Cobro Rápido / Mostrador</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Búsqueda y Concepto -->
  <div class="input-card">
    <ion-label position="stacked"><b>Producto / Concepto</b></ion-label>
    <div class="search-row">
      <ion-input
        type="text"
        [(ngModel)]="concepto"
        placeholder="Ej. Solución, Armazón, Cód. Barras"
        (keyup.enter)="buscarProducto()"
      ></ion-input>
      <ion-button fill="clear" (click)="buscarProducto()" title="Buscar en inventario">
        <ion-icon name="search-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </div>

  <!-- Precio del Producto -->
  <div class="input-card">
    <ion-label position="stacked"><b>Total a Cobrar ($)</b></ion-label>
    <ion-input
      type="number"
      [(ngModel)]="precio"
      placeholder="0.00"
      min="0"
      (ionInput)="calcularCambio()"
    ></ion-input>
  </div>

  <!-- Selección Método de Pago -->
  <div class="metodo-section">
    <p><b>Método de Pago</b></p>
    <ion-segment [(ngModel)]="metodoPago" (ionChange)="calcularCambio()">
      <ion-segment-button value="EFECTIVO">
        <ion-icon name="cash-outline"></ion-icon>
        <ion-label>Efectivo</ion-label>
      </ion-segment-button>
      <ion-segment-button value="TARJETA">
        <ion-icon name="card-outline"></ion-icon>
        <ion-label>Tarjeta</ion-label>
      </ion-segment-button>
    </ion-segment>
  </div>

  <!-- Pago recibido y Cambio (Solo si es efectivo) -->
  <ng-container *ngIf="metodoPago === 'EFECTIVO'">
    <div class="input-card highlight">
      <ion-label position="stacked"><b>Efectivo Recibido ($)</b></ion-label>
      <ion-input
        type="number"
        [(ngModel)]="efectivoRecibido"
        placeholder="Ingrese el dinero recibido"
        min="0"
        (ionInput)="calcularCambio()"
      ></ion-input>
    </div>

    <div class="cambio-box" [class.insuficiente]="cambio < 0">
      <span>{{ cambio >= 0 ? 'Cambio / Feria:' : 'Falta para completar:' }}</span>
      <h2>${{ cambioAbsoluto | number:'1.2-2' }}</h2>
    </div>
  </ng-container>

  <ion-button
    expand="block"
    shape="round"
    color="success"
    class="ion-margin-top"
    [disabled]="!esValido"
    (click)="confirmarCobro()"
  >
    <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
    Confirmar y Cobrar ${{ precio || 0 | number:'1.2-2' }}
  </ion-button>
</ion-content>
