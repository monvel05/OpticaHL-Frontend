<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Gestión de Operadores</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (op of operadores; track op.id || $index) {
      <ion-item>
        <ion-avatar slot="start">
          <img [src]="'https://ui-avatars.com/api/?name=' + op.nombre" />
        </ion-avatar>
        <ion-label>
          <h2>{{ op.nombre }}</h2>
          <p>{{ op.rol }} - {{ op.sucursal }}</p>
        </ion-label>
        <ion-button fill="clear" (click)="editar(op)">Editar</ion-button>
        <ion-button fill="clear" color="danger" (click)="eliminar(op.id)">Eliminar</ion-button>
      </ion-item>
    }
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="abrirModalCrear()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
